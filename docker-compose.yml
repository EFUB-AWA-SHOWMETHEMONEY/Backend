services:
  mysql:
    image: mysql:8.4
    container_name: moamoa-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-moamoa}
      MYSQL_USER: ${DB_USERNAME:-moamoa}
      MYSQL_PASSWORD: ${DB_PASSWORD:-moamoa}

    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: moamoa-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-moamoa}

    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data: