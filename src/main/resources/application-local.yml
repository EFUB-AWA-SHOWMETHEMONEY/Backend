spring:
  datasource:
    # innodb_lock_wait_timeout: 비관적 락 대기 한도(초). MySQL 기본 50초는 너무 길어 3초로 제한
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:moamoa}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&sessionVariables=innodb_lock_wait_timeout=3
    username: ${DB_USERNAME:moamoa}
    password: ${DB_PASSWORD:moamoa}
  jpa:
    hibernate:
      # local 전용: 매 기동 시 스키마를 재생성한다 (엔티티 변경이 바로 반영됨)
      # 운영/공용 DB를 가리킨 채 실행하면 데이터가 사라지므로 이 파일 밖으로 복사하지 말 것
      ddl-auto: create
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:moamoa}
jwt:
  # local 전용 개발용 기본값. 운영 환경에서는 반드시 JWT_SECRET 환경변수로 주입 (HS256: 32바이트 이상)
  secret: ${JWT_SECRET:moamoa-local-dev-secret-key-do-not-use-in-production-0123456789}


app:
  websocket:
    allowed-origins: http://localhost:8080, http://localhost:3000, http://localhost:5173